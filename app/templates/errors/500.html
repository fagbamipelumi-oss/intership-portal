{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="text-center py-5">
    <p class="page-eyebrow is-centered">Error 500</p>
    <h2 class="mb-3">Something went wrong on our end</h2>
    <p class="text-muted mb-4">Please try again in a moment. If this keeps happening, let us know what you were doing.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
