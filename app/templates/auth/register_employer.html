{% extends "base.html" %}
{% block title %}Employer Sign Up{% endblock %}
{% block content %}
<div class="auth-panel is-employer">
    <p class="page-eyebrow">Employer account</p>
    <h2 class="mb-4">Create a Company Account</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" name="company_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <p class="panel-footnote">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.
    </p>
</div>
{% endblock %}
