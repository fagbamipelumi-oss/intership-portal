{% extends "base.html" %}
{% block title %}{{ "Edit Job" if job else "Post a Job" }}{% endblock %}
{% block content %}
<p class="page-eyebrow">{{ "Editing listing" if job else "New listing" }}</p>
<h2 class="mb-4">{{ "Edit Job / Internship" if job else "Post a Job / Internship" }}</h2>
<div class="form-panel">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required value="{{ job.title if job else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" required>{{ job.description if job else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Required Skills (comma-separated)</label>
            <input type="text" name="required_skills" class="form-control" placeholder="Python, Django"
                   value="{{ job.required_skills | join(', ') if job and job.required_skills else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Qualifications</label>
            <textarea name="qualifications" class="form-control" rows="2">{{ job.qualifications if job else '' }}</textarea>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ job.location if job else '' }}">
            </div>
            <div class="col mb-3">
                <label class="form-label">Type</label>
                <select name="job_type" class="form-select">
                    <option value="internship" {% if job and job.job_type == 'internship' %}selected{% endif %}>Internship</option>
                    <option value="full-time" {% if job and job.job_type == 'full-time' %}selected{% endif %}>Full-time</option>
                    <option value="part-time" {% if job and job.job_type == 'part-time' %}selected{% endif %}>Part-time</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Minimum CGPA</label>
                <input type="number" step="0.01" min="0" max="5" name="min_cgpa" class="form-control" value="{{ job.min_cgpa if job else '0' }}">
            </div>
            <div class="col mb-3">
                <label class="form-label">Application Deadline</label>
                <input type="date" name="deadline" class="form-control" value="{{ job.deadline if job else '' }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">{{ "Save Changes" if job else "Post Job" }}</button>
    </form>
</div>
{% endblock %}
