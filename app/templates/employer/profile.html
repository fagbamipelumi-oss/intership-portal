{% extends "base.html" %}
{% block title %}Company Profile{% endblock %}
{% block content %}
<p class="page-eyebrow">Company profile</p>
<h2 class="mb-4">{{ employer.company_name }}</h2>
<div class="form-panel">
    <form method="POST">
        <div class="form-section-title">Company Details</div>
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" name="company_name" class="form-control" required value="{{ employer.company_name }}">
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Industry</label>
                <input type="text" name="industry" class="form-control" value="{{ employer.industry or '' }}" placeholder="e.g. Fintech, Healthcare, Logistics">
            </div>
            <div class="col mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ employer.location or '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Company Description</label>
            <textarea name="description" class="form-control" rows="4" placeholder="What does your company do?">{{ employer.description or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Save Changes</button>
    </form>
</div>
{% endblock %}
