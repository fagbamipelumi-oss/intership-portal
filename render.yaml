services:
  - type: web
    name: internship-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: internship-portal-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_CONTENT_LENGTH
        value: "5242880"

databases:
  - name: internship-portal-db
    plan: free